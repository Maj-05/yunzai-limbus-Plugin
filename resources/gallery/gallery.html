{{extend defaultLayout}}

{{block 'css'}}
<link rel="stylesheet" type="text/css" href="{{pluResPath}}gallery/gallery.css"/>
{{/block}}

{{block 'main'}}
<div class="gal-head">
  <div class="gal-title">立绘画廊</div>
  <div class="gal-label">{{kind}} · 共 {{total}} 张</div>
</div>

{{each groups g}}
<div class="gal-group">
  <div class="gal-char">{{g.charName}} <span class="gal-count">{{g.items.length}}</span></div>
  <div class="gal-grid">
    {{each g.items it}}
    <div class="gal-item">
      <div class="gal-frame" style="border-color:{{it.rankColor}}">
        {{if it.local}}<img class="gal-img" src="{{pluResPath}}art/{{it.src.path}}" onerror="this.onerror=null;this.style.display='none';"/>
        {{else}}<img class="gal-img" src="{{it.src.url}}" onerror="this.onerror=null;this.style.display='none';"/>{{/if}}
        <span class="gal-rank" style="background:{{it.rankColor}}">{{it.rankName}}</span>
      </div>
      <div class="gal-name">{{it.name}}</div>
      <div class="gal-season">{{it.seasonLabel}}</div>
    </div>
    {{/each}}
  </div>
</div>
{{/each}}

<div class="copyright">{{@sys.copyright}}</div>
{{/block}}
